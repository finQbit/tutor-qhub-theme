#https://hatch.pypa.io/latest/config/build/

[project]
name = "tutor-qhub-theme"
description = "Quantum Hub theme for Tutor, based on Indigo"
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "AGPLv3" }
requires-python = ">=3.10"
authors = [{ name = "Edly" }, { email = "hello@edly.io" }]
maintainers = [{ name = "finQbit" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
  "tutor-mfe>=22.0.0,<23.0.0", 
  "tutor>=22.0.0,<23.0.0"
]

dynamic = ["version"]

[project.optional-dependencies]
dev = [
  "ruff==0.17.3",
  "mypy",
  "build",
  "twine",
  "django",
  "djangorestframework",
  "uv",
]

[project.entry-points."tutor.plugin.v1"]
indigo = "tutorindigo.plugin"

[project.urls]
Code = "https://github.com/finQbit/tutor-qhub-theme"
Community = "https://discuss.openedx.org"
Documentation = "https://docs.tutor.edly.io/"
Homepage = "https://github.com/finQbit/tutor-qhub-theme"
Changelog = "https://github.com/finQbit/tutor-qhub-theme/blob/release/CHANGELOG.md"
Issues = "https://github.com/finQbit/tutor-qhub-theme/issues"

# hatch related configurations
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["tutorindigo/brand/dist/**", "tutorindigo/templates/indigo/**/images/*.png", "tutorindigo/templates/indigo/**/images/*.ico"]

[tool.hatch.build.targets.sdist]
# Disable strict naming, otherwise twine is not able to detect name/version
strict-naming = false
include = ["/tutorindigo", "/scripts", "/tests", "/dev", "/README.md", "/README.rst", "/LICENSE.txt", "/Makefile"]
exclude = ["**/node_modules/**", "**/__pycache__/**", "**/brand/paragon/build/**", "**/brand/paragon/tokens/build-src/**"]

# we need this becuase our project escapes default hatch file selection.
# see https://hatch.pypa.io/latest/plugins/builder/wheel/#default-file-selection
[tool.hatch.build.targets.wheel]
packages = ["/tutorindigo"]

[tool.hatch.version]
path = "tutorindigo/__about__.py"

[tool.ruff]
exclude = ["tutorindigo/templates/indigo/", "docs/_ext"]

[tool.ruff.lint]
# E: pycodestyle errors
# I: isort
# N: pep8-naming
select = ["E", "I", "N"]

# F401: unused-import
# F841: unused-variable
# W292: missing-newline-at-end-of-file
extend-select = ["F401", "F841", "W292"]

[tool.ruff.format]
